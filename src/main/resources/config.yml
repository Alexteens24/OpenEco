currencies:
  # Preferred multi-currency config. OpenEco will migrate legacy currency.*
  # keys into this layout on startup/reload and remove the old section.
  default: openeco
  definitions:
    openeco:
      name-singular: "Dollar"
      name-plural: "Dollars"
      # Number of decimal places (0-8)
      decimal-digits: 2
      # Balance given to new accounts
      starting-balance: 0.00
      # Maximum balance a player can hold (-1 = unlimited)
      max-balance: -1
      # Available placeholders: <amount>, <name>, <currency>. <amount> is required.
      format: "<amount> <name>"
      grouping: false
      # Separators must each be exactly one different character.
      decimal-separator: "."
      grouping-separator: ","

storage:
  # Backend to use: sqlite, h2, mysql, mariadb, or postgresql
  # Changing backend or file name does not move data by itself; use /openecomigrate sqlitetomysql (see docs/migration.md).
  type: sqlite
  sqlite:
    file: economy.db
  h2:
    # File name (without extension); H2 appends .mv.db automatically
    file: economy
  mysql:
    host: localhost
    port: 3306
    database: openeco
    username: root
    password: ""
    # Number of concurrent database connections (remote backends only)
    pool-size: 10
    connection-timeout-seconds: 10
    # preferred, disabled, required, verify-ca, or verify-full
    ssl-mode: preferred
    # Optional full JDBC URL override. When set, host/port/database/ssl-mode are ignored.
    jdbc-url: ""
  mariadb:
    host: localhost
    port: 3306
    database: openeco
    username: root
    password: ""
    pool-size: 10
    connection-timeout-seconds: 10
    # disabled, trust, verify-ca, or verify-full
    ssl-mode: disabled
    jdbc-url: ""
  postgresql:
    host: localhost
    port: 5432
    database: openeco
    username: postgres
    password: ""
    pool-size: 10
    connection-timeout-seconds: 10
    # disable, allow, prefer, require, verify-ca, or verify-full
    ssl-mode: prefer
    jdbc-url: ""
  migration:
    # Optional local backup source when the server already runs on a remote backend.
    # Leave source-folder and source-file empty to migrate from the active local database.
    source-type: sqlite
    source-folder: ""
    source-file: ""

persistence:
  # Seconds between automatic background saves. Must be greater than 0.
  # Lower values reduce worst-case data loss after a crash but increase write pressure.
  autosave-interval-seconds: 30

# Account loading policy. Changing mode or lazy cache retention requires a restart.
account-loading:
  # eager loads every account at startup; lazy loads accounts on demand.
  mode: eager
  lazy:
    cache:
      # Retain clean offline accounts for reuse. Online and in-flight accounts are always retained.
      enabled: true
      # Retain at most this many inactive clean accounts when possible.
      maximum-size: 50000
      # Evict inactive clean accounts after this many idle minutes.
      expire-after-access-minutes: 30

pay:
  # Cooldown between /pay uses in seconds (0 = disabled)
  cooldown-seconds: 0
  # Percentage of the sent amount deducted as tax (0.0 = disabled)
  tax-percent: 0.0
  # Minimum amount a player can pay in one transaction (0 = no minimum)
  # Raising this helps suppress spammy micro-transfers on live servers.
  min-amount: 0.01

baltop:
  # Must be greater than 0
  page-size: 10
  # Seconds between background refreshes of dirty leaderboard snapshots
  refresh-interval-seconds: 30

history:
  # Must be greater than 0
  page-size: 10
  # Number of days to keep transaction history (<= 0 = keep forever, no pruning)
  # Transactions older than this will be deleted automatically once per day.
  retention-days: -1

cross-server:
  # Enable shared-DB network mode (MySQL / MariaDB / PostgreSQL only).
  # multi-writer commits every mutation atomically in the database and allows concurrent
  # backend writers. Reads use a local cache refreshed from a durable change log.
  # handoff retains the legacy proxy flush/refresh behavior and assumes one writer/account.
  # Requires a restart to take effect after toggling.
  enabled: false
  # multi-writer is database-authoritative and safe across concurrent backends.
  # handoff preserves the legacy proxy flush/refresh model.
  mode: multi-writer
  # Durable JDBC change-log polling remains active even when Redis is enabled.
  cache-refresh-interval-ms: 250
  poll-batch-size: 1000
  change-retention-days: 7
  redis:
    enabled: false
    uri: "redis://localhost:6379"
    channel: "openeco:changes"

