name: OpenEcoMigrator
version: "${version}"
main: dev.alexisbinh.openeco.migrator.OpenEcoMigratorPlugin
description: "Addon for OpenEco: migrate balances from other economy plugins"
api-version: '1.21'
authors:
  - alexisbinh

depend:
  - OpenEco

permissions:
  openeco.migrator.admin:
    description: Use /openecomigrate economy sources (registered by OpenEco)
    default: op
