name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

  build:
    name: Build And Test
    runs-on: ubuntu-latest
    needs: wrapper-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project and addons
        run: ./gradlew --no-daemon build :api:build :enhancements-addon:build :proxy-addon:build

      - name: Upload plugin jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openeco-jars
          path: |
            build/libs/*.jar
            enhancements-addon/build/libs/*.jar
            proxy-addon/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openeco-test-reports
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            enhancements-addon/build/reports/tests/test/**
            enhancements-addon/build/test-results/test/**
            proxy-addon/build/reports/tests/test/**
            proxy-addon/build/test-results/test/**
          if-no-files-found: warn

  remote-storage:
    name: Remote Storage Integration
    runs-on: ubuntu-latest
    needs: wrapper-validation

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: openeco
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: openeco
        ports:
          - 13307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -ptest --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openeco
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d openeco"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test remote storage operations
        env:
          OPEN_ECO_REMOTE_TESTS: 'true'
        run: ./gradlew --no-daemon :test --tests '*Remote*IntegrationTest'
